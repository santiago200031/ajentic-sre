quarkus.application.name=ajentic-sre
quarkus.http.port=8080
quarkus.http.test-port=8081
# Keep stdout free for CLI output and MCP JSON-RPC; logs belong on stderr.
quarkus.banner.enabled=false
quarkus.log.console.stderr=true

# Swagger UI & OpenAPI are always-on (dev, test, and prod containers). The path is resolved under /q by Quarkus,
# so leave these at their defaults: /q/swagger-ui and /q/openapi. Do NOT prefix them with /q/.
quarkus.swagger-ui.always-include=true

# Environment backend. simulated is deterministic, offline and the only backend used by tests/CI;
# local-container and cloud-live are live adapters over the endpoints below (cloud-live is read-only).
ajentic.environment.backend=simulated

# Live telemetry endpoints for the local-container / cloud-live backends.
# Env vars AJENTIC_LIVE_PROMETHEUS_URL / AJENTIC_LIVE_LOKI_URL / AJENTIC_LIVE_REMEDIATION_URL override these.
# Remediation dispatch is only attempted when AJENTIC_LIVE_REMEDIATION_URL is set.
ajentic.live.prometheus-url=http://localhost:9090
ajentic.live.loki-url=http://localhost:3100
ajentic.live.timeout=5s

# LLM provider. openai-compatible (and its aliases openai, azure, aws, llamacpp, ollama, vllm, wiremock)
# all use the OpenAI /chat/completions wire contract; scripted runs fully offline.
ajentic.llm.provider=openai-compatible
ajentic.llm.base-url=http://127.0.0.1:9931/v1
ajentic.llm.api-key=local
ajentic.llm.model=Cyber-Tiel-Coder-35B-A3B-UD-Q4_K_XL
ajentic.llm.timeout=300s
ajentic.llm.temperature=0.0

# Endpoint shape. Azure OpenAI appends api-version and authenticates with the api-key header.
ajentic.llm.chat-completions-path=/chat/completions
#ajentic.llm.api-version=2025-01-01-preview
#ajentic.llm.api-key-header=api-key

# Failover: when enabled, LLM calls retry against the ordered endpoints below on transport errors, upstream
# 4xx/5xx, unparseable responses, or context-overflow rejections. Each entry is
#   base-url|model|api-key|api-version|api-key-header
# separate multiple endpoints with a comma. Keys are never logged.
# e.g. ajentic.llm.fallback-endpoints=https://openrouter.ai/api/v1|openai/gpt-4o|${OPENROUTER_API_KEY}
#ajentic.llm.fallback-endpoints=
ajentic.llm.fallback-enabled=false

# GitHub code-remediation tools (feat/github-code-tools). Base URL is the GitHub REST API; the token is only sent
# for authenticated requests and never reaches the model. Leave token blank for read-only analysis of public repos.
ajentic.github.base-url=https://api.github.com
#ajentic.github.token=
#ajentic.github.timeout=30s

# Tests run fully offline against the scripted client unless a live-llm run is requested.
# The @QuarkusTest suite otherwise runs over WireMock through the real HTTP client.
%test.ajentic.llm.provider=scripted
ajentic.llm.live=false

# Mutating tools require the MUTATE capability.
ajentic.tools.allow-mutations=true

# Cumulative token budget per agent session; 0 disables the hard stop.
ajentic.agent.max-tokens=0

# Stagnation breaker: flag a tool repeated with identical arguments at the threshold, escalate after escalate-after,
# and stop the loop with a diagnostic answer instead of burning maxIterations.
ajentic.agent.stagnation.threshold=2
ajentic.agent.stagnation.escalate-after=3

# External scenario packs directory (YAML/JSON); empty disables loading. External ids may not shadow built-ins.
# (configured via ajentic.scenarios.dir; default empty = disabled)
ajentic.scheduler.max-concurrent-runs=4
ajentic.scheduler.recovery-delay=30s
ajentic.scheduler.tick-interval=1s
ajentic.scheduler.zone=UTC

# Alert webhook intake: scenario fallback when no built-in scenario names the alerted service, and the cap on
# concurrent investigations. Optional: ajentic.webhooks.secret (verify intake calls) and
# ajentic.webhooks.notification-url (post reports to a Slack-style webhook).
ajentic.webhooks.default-scenario=orders-bad-deployment
ajentic.webhooks.max-concurrent=4
