apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ajentic-sre-isolation
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ajentic-sre
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow external traffic only to agent port 8080
    - ports:
        - protocol: TCP
          port: 8080
  egress:
    # Allow DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
    # Allow sidecar to reach cloud APIs (port 443)
    - ports:
        - protocol: TCP
          port: 443
